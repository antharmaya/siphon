name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']  # oldest supported and newest: stdlib behaviour differs between them
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # the runner image ships Google Chrome; the sniffer and blob-capture tests drive it
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg rclone
      - run: uv run --python ${{ matrix.python }} pytest -q
